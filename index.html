<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Parakkat Nature Resort &mdash; Menus</title>
    <meta name="description" content="Restaurant menu, room service menu and Ayurvedic spa brochure for Parakkat Nature Resort." />
    <meta name="theme-color" content="#0e1310" />
    <link rel="icon" type="image/png" href="./logo parakkat.png" />
    <script>
      document.documentElement.classList.add('js');
      // If app.js never runs, don't leave the fade-in content hidden.
      setTimeout(function () {
        if (!window.__menusReady) document.documentElement.classList.remove('js');
      }, 3000);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar" id="top">
      <a href="#top" class="topbar-brand" aria-label="Parakkat Nature Resort, back to top">
        <img src="./logo parakkat.png" alt="" width="44" height="40" />
        <span>Parakkat</span>
      </a>
      <nav class="topbar-nav" aria-label="Menus" id="topbar-nav"></nav>
    </header>

    <section class="hero">
      <img class="hero-bg" src="./assets/hero-1200.jpg" srcset="./assets/hero-1200.jpg 1200w, ./assets/hero-1920.jpg 1920w" sizes="100vw" alt="Parakkat Nature Resort in the misty hills" fetchpriority="high" />
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-shade"></div>
      <div class="hero-leaves" id="hero-leaves" aria-hidden="true"></div>
      <div class="hero-content" id="hero-content">
        <img class="hero-logo intro" style="--i: 0" src="./logo parakkat.png" alt="Parakkat Nature Hotel &amp; Resorts" />
        <h1 class="hero-title intro" style="--i: 1" id="hero-title">Our Menus</h1>
        <span class="hero-rule intro" style="--i: 3" aria-hidden="true"></span>
        <p class="hero-sub intro" style="--i: 4">Choose a menu to read it right here, or save it to your phone.</p>
        <div class="hero-chips intro" style="--i: 5" id="hero-chips"></div>
      </div>
      <a href="#menus" class="scroll-cue intro" style="--i: 7" aria-label="Scroll to the menus">
        <span></span>
      </a>
    </section>

    <main>
      <section class="menus" id="menus" aria-labelledby="menus-heading">
        <div class="section-head reveal">
          <p class="eyebrow">Discover</p>
          <h2 id="menus-heading">Menus &amp; Brochures</h2>
        </div>
        <div class="menu-grid" id="menu-grid"></div>
      </section>

      <section class="gallery" id="gallery" aria-labelledby="gallery-heading">
        <div class="section-head reveal">
          <p class="eyebrow">Our surroundings</p>
          <h2 id="gallery-heading">A glimpse of Parakkat</h2>
        </div>
        <div class="gallery-track" tabindex="0" aria-label="Resort photos, scroll sideways">
          <img src="./resort/2decbb6c-00a1-46c9-aa38-3d626719a02b.JPG" loading="lazy" alt="Cave-themed room interior" />
          <img src="./resort/cb79251c-cf9a-4aaa-99e0-d4a8cd795227.JPG" loading="lazy" alt="Restaurant with a hillside view" />
          <img src="./resort/4d88205d-bb6d-4a53-bafa-9a96f0c52cd6.JPG" loading="lazy" alt="Forest walkway" />
          <img src="./resort/52fcd06e-4a01-4962-9cb3-75c806709e74.JPG" loading="lazy" alt="Canopy net walk" />
          <img src="./resort/8f747c95-d9a4-4b1c-85fe-3292fc5653bd.JPG" loading="lazy" alt="Treehouse in the gardens" />
          <img src="./resort/5a17d674-5cd8-4173-a8b2-d283e0d5ad3b.JPG" loading="lazy" alt="Garden seating among ferns" />
          <img src="./resort/aa61882a-ee64-4459-baf0-1c439e0e8e15.JPG" loading="lazy" alt="Treehouse among the trees" />
          <img src="./resort/f5ff7052-5d99-4aa0-83b1-cdca137fd873.JPG" loading="lazy" alt="Resort jeep" />
          <img src="./resort/f7825e8c-b53a-4190-9c33-aefed3eba518.JPG" loading="lazy" alt="Stone steps through the forest" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <img src="./logo parakkat.png" alt="Parakkat Nature Hotel &amp; Resorts" class="footer-logo" loading="lazy" />
      <p class="footer-links">
        <a href="https://www.parakkatresorts.com" target="_blank" rel="noopener">parakkatresorts.com</a>
        <span aria-hidden="true">&middot;</span>
        <a href="mailto:info@parakkatresorts.com">info@parakkatresorts.com</a>
      </p>
      <p class="footer-copy">&copy; Parakkat Nature Resort</p>
    </footer>

    <!-- Full-screen PDF reader, opened from a menu card or a #menu-id link -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
      <div class="viewer-bar">
        <button class="icon-btn" id="viewer-close" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <div class="viewer-heading">
          <p class="viewer-label" id="viewer-label"></p>
          <h2 id="viewer-title"></h2>
        </div>
        <div class="viewer-tools">
          <span class="viewer-count" id="viewer-count" aria-live="polite"></span>
          <button class="icon-btn hide-sm" id="zoom-out" type="button" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button class="icon-btn hide-sm" id="zoom-in" type="button" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <a class="icon-btn" id="viewer-download" download aria-label="Download PDF">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
          </a>
        </div>
      </div>
      <div class="viewer-progress" id="viewer-progress"><span></span></div>
      <div class="viewer-pages" id="viewer-pages" tabindex="-1"></div>
    </div>

    <script src="./menus/menus.js"></script>
    <script src="./vendor/pdfjs/pdf.min.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
